# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "embedded-apps"
BBFILE_PATTERN_embedded-apps := "^${LAYERDIR}/"
BBFILE_PRIORITY_embedded-apps = "10"

# This layer provides the following application recipes:
#   discordo_git.bb     - ayn2op/discordo terminal Discord client (21 vendored Go modules)
#   nanobrowser_git.bb  - DanielMartensson/NanoBrowser QtWebEngine browser
#   ytgst_git.bb        - DanielMartensson/YtGst YouTube client
#   vlc_3.0.20.bbappend - the seat's shape of upstream's VLC player: upstream's
#   vlc_3.0.20.bb already lives in meta-multimedia and asks REQUIRED_DISTRO_FEATURES
#   = "x11", which this board has none of, so this bbappend is the delta that puts
#   the player on a Weston seat - wayland for the display half, the panel's own
#   GL ES 2 context, and gstreamer as the decode route
# plus the payload that makes that player a proof rather than an installation,
# and the dependency recipes those applications need and the existing stack
# lacks:
#   bigbuckbunny.bb  (the 1080p H.264 film VLC plays, one file, CC BY 3.0 pinned
#   as a LicenseRef, so the gst-decode route can be shown carrying a real picture
#   to this panel at the seat's own 1920x1080)
#   yt-dlp  (runtime downloader required by YtGst)
#   the gstreamer1.0-plugins-good bbappend (the Qt6 QML video sink YtGst draws
#   into) and the qtwebengine bbappend that keeps NanoBrowser buildable on
#   aarch64
#
# The games, the game engines and the OpenNOW/CloudMatch clients do not live
# here: they are in meta-good-old-games, whose scarthgap branch carries them
# under recipes-games, and the SDL 3 and host-rust recipes those clients need
# moved with them.
#
# It does NOT provide meta-qt6, meta-rust-bin or meta-clang. Those updated
# layers are re-added by the Watermelon-Wine BSP manifest and MUST be on
# BBLAYERS (they are currently represented by the "qt6-layer",
# "rust-bin-layer" and "clang-layer" collections).
LAYERDEPENDS_embedded-apps = "core openembedded-layer meta-python multimedia-layer"

# Matches the release series of the surrounding oe-core layers
LAYERSERIES_COMPAT_embedded-apps = "scarthgap"
