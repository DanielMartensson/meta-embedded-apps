# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "embedded-apps"
BBFILE_PATTERN_embedded-apps := "^${LAYERDIR}/"
BBFILE_PRIORITY_embedded-apps = "10"

# This layer provides the following application recipes:
#   opennow_git.bb      - OpenCloudGaming/OpenNOW cloud gaming client
#   opennowlite_git.bb  - the plan-B OpenNOWLite client, sources vendored at its files/native
#   discordo_git.bb     - ayn2op/discordo terminal Discord client (21 vendored Go modules)
#   fteqw_git.bb        - fte-team/fteqw compiled gles-only, the engine both games run on
#   librequake.bb       - LibreQuake v0.09-beta free Quake data, installed as id1
#   openarena.bb        - OpenArena 0.8.8 free arena data (baseoa + missionpack)
#   nanobrowser_git.bb  - DanielMartensson/NanoBrowser QtWebEngine browser
#   ytgst_git.bb        - DanielMartensson/YtGst YouTube client
# plus dependency recipes missing from the existing stack:
#   libsdl3 (SDL 3.x, required by OpenNOW)
#   yt-dlp  (runtime tool required by YtGst)
#   the two rust-1.8x-host.bb recipes (the host cargo the CloudMatch clients'
#   do_compile runs) and discordo's vendored dependency tarball
#
# It does NOT provide meta-qt6, meta-rust-bin or meta-clang. Those updated
# layers are re-added by the Watermelon-Wine BSP manifest and MUST be on
# BBLAYERS (they are currently represented by the "qt6-layer",
# "rust-bin-layer" and "clang-layer" collections).
LAYERDEPENDS_embedded-apps = "core openembedded-layer meta-python multimedia-layer"

# Matches the release series of the surrounding oe-core layers
LAYERSERIES_COMPAT_embedded-apps = "scarthgap"